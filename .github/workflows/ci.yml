name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['24.0.0', '24.x']
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: jdx/mise-action@v2
        with:
          install: false
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run check-types
      - run: bun test
        env:
          XSCS_NETWORK_TESTS: '1'
      - run: bun run prerelease-check
      - run: bun run npm-package-smoke

  standalone:
    name: Standalone (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: bun-darwin-arm64
            artifact: xscs-darwin-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64-baseline
            artifact: xscs-darwin-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: xscs-linux-arm64
          - runner: ubuntu-24.04
            target: bun-linux-x64-baseline
            artifact: xscs-linux-x64
          # The Windows artifact is built by standalone-windows below, not here.
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun scripts/build-standalone.ts --target ${{ matrix.target }}
      - run: bun scripts/smoke-standalone.ts release/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  # Bun 1.3.9 cannot extract its own bun-windows-x64-baseline compile target
  # when it is running *on* a Windows host ("Failed to extract executable ...
  # The download may be incomplete"), and it caches the unusable file, so the
  # failure is sticky rather than flaky. Cross-compiling the same target from
  # Linux is the supported path and produces a valid PE32+ binary, so the
  # Windows artifact is built here and executed on Windows in the next job.
  standalone-windows:
    name: Standalone (xscs-windows-x64.exe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun scripts/build-standalone.ts --target bun-windows-x64-baseline
      - uses: actions/upload-artifact@v6
        with:
          name: xscs-windows-x64.exe
          path: release/xscs-windows-x64.exe
          if-no-files-found: error

  standalone-windows-smoke:
    name: Standalone smoke (xscs-windows-x64.exe)
    needs: standalone-windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/download-artifact@v7
        with:
          name: xscs-windows-x64.exe
          path: release
      - run: bun scripts/smoke-standalone.ts release/xscs-windows-x64.exe
